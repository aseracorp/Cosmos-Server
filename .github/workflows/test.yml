name: Test

# Runs the Go test suite for open pull requests. Deliberately separate from
# build.yml, which fires on push to master/unstable and publishes a release
# (GHCR image + GitHub Release + zips): this workflow must never gain those
# permissions, and a PR should not be able to reach them.
#
# `pull_request` resolves workflows from the PR's merge ref, so a PR that adds
# this file is covered by it on its own first push. Verified in this repo: a PR
# whose head has the file and base does not gets a run, and so does the reverse.
# The `branches` filter matches the PR's BASE branch, so PRs into master and
# unstable are the ones covered.
on:
  pull_request:
    branches: [ "master", "unstable" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Read-only: tests need nothing else, and pull requests from forks get no
# secrets and a read-only token anyway.
permissions:
  contents: read

# One run per PR branch: a force-push replaces the in-flight run.
concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: install go
        uses: actions/setup-go@v7
        with:
          go-version-file: './go.mod'

      # src/launcher/update.go is gitignored and generated by build.sh;
      # go test ./src/... cannot compile src/launcher without it.
      - name: Test
        run: |
          cp src/update.go src/launcher/update.go
          go test -count=1 ./src/...
