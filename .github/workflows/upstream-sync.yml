name: Sync upstream fork

on:
  # Run at least daily: every 6 hours (0, 6, 12, 18 UTC)
  schedule:
    - cron: '17 */6 * * *'
  # Allow manual runs from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-branch:
    strategy:
      fail-fast: false
      matrix:
        branch: [master, unstable]
    runs-on: ubuntu-latest

    env:
      UPSTREAM: azukaar/Cosmos-Server

    steps:
      - name: Checkout ${{ matrix.branch }}
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0

      - name: Add upstream remote
        run: git remote add upstream https://github.com/${{ env.UPSTREAM }}.git

      - name: Fetch upstream
        run: git fetch upstream ${{ matrix.branch }}

      - name: Check for new upstream commits
        id: check
        run: |
          BEHIND=$(git rev-list --count HEAD..upstream/${{ matrix.branch }})
          echo "behind=$BEHIND"
          echo "behind=$BEHIND" >> "$GITHUB_ENV"

      - name: Merge upstream into ${{ matrix.branch }} and push
        if: env.behind != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit upstream/${{ matrix.branch }}
          git push origin "${{ matrix.branch }}"

      - name: Report
        if: always()
        run: echo "${{ matrix.branch }} synced (behind=${{ env.behind }})."
