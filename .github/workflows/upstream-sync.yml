name: Sync upstream fork

on:
  # Hourly check (far more often than "at least daily"). A cheap upstream-SHA
  # ancestor check skips the fetch/merge entirely when nothing changed.
  schedule:
    - cron: '17 * * * *'
  # Allow manual runs from the Actions tab
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write   # required to dispatch the build workflow

jobs:
  sync-branch:
    strategy:
      fail-fast: false
      matrix:
        branch: [master, unstable]
    runs-on: ubuntu-latest

    env:
      UPSTREAM: azukaar/Cosmos-Server
      SYNC_BRANCH: sync-upstream-${{ matrix.branch }}

    steps:
      - name: Checkout ${{ matrix.branch }}
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0

      - name: Add upstream remote and fetch
        run: |
          git remote add upstream https://github.com/${{ env.UPSTREAM }}.git
          git fetch upstream ${{ matrix.branch }}

      - name: Check if upstream tip is already merged in
        id: changed
        run: |
          UPSTREAM_TIP=$(git rev-parse "upstream/${{ matrix.branch }}")
          echo "upstream_tip=${UPSTREAM_TIP}"
          # Already an ancestor of our local branch => nothing to do.
          if git merge-base --is-ancestor "${UPSTREAM_TIP}" HEAD; then
            echo "No upstream change for ${{ matrix.branch }}; already in sync."
          else
            echo "Upstream has new commits for ${{ matrix.branch }}."
            echo "changed=true" >> "$GITHUB_ENV"
            echo "upstream-tip=${UPSTREAM_TIP}" >> "$GITHUB_OUTPUT"
          fi

      # Merge upstream into a non-protected sync branch. The "protect branch"
      # ruleset blocks direct pushes to master/unstable, so the merge lands
      # via PR (or a bot-token push when configured).
      - name: Merge upstream into ${{ matrix.branch }} sync branch
        if: env.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${{ env.SYNC_BRANCH }}"
          git merge --no-edit upstream/${{ matrix.branch }}

      # Land the merge: prefer an org-admin bot token (bypasses the ruleset,
      # same pattern as openwrt-packages/version-check.yml). If that secret is
      # not configured, fall back to a PR (ruleset requires 0 approvals).
      - name: Land upstream merge
        if: env.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_BOT_TOKEN: ${{ secrets.GH_BOT_TOKEN }}
        run: |
          set -e

          # Option A: direct push with the org-admin bot token (bypasses the
          # "protect branch" ruleset). Only runs if the secret exists.
          if [ -n "${GH_BOT_TOKEN}" ]; then
            echo "::group::Direct push with GH_BOT_TOKEN"
            git config --unset-all "http.https://github.com/.extraheader" || true
            git remote set-url origin "https://x-access-token:${GH_BOT_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            n=0
            while :; do
              if git push origin "${{ env.SYNC_BRANCH }}:${{ matrix.branch }}"; then
                echo "Direct push to ${{ matrix.branch }} succeeded with bot token."
                echo "::endgroup::"
                exit 0
              fi
              n=$((n+1))
              if [ "$n" -ge 5 ]; then
                echo "ERROR: could not push after 5 attempts" >&2
                echo "::endgroup::"
                exit 1
              fi
              echo "push rejected, rebasing and retrying ($n/5)"
              git pull --rebase origin "${{ matrix.branch }}"
            done
          fi

          # Option B: PR flow with GITHUB_TOKEN.
          echo "::group::PR flow"
          git push --force-with-lease origin "${{ env.SYNC_BRANCH }}"

          EXISTING=$(gh pr list --head "${{ env.SYNC_BRANCH }}" --state open --json number --jq '.[0].number' 2>/dev/null || true)
          TITLE="chore: sync with upstream/${{ matrix.branch }}"
          BODY="Automated sync with upstream (${{ env.UPSTREAM }}) for the \`${{ matrix.branch }}\` branch. Merge to apply the latest upstream commits."
          if [ -n "$EXISTING" ]; then
            echo "Sync PR #${EXISTING} already open — updating it."
            gh pr edit "$EXISTING" --title "$TITLE" --body "$BODY" >/dev/null || true
            PR_NUMBER="$EXISTING"
          else
            PR_NUMBER=$(gh pr create --base "${{ matrix.branch }}" --head "${{ env.SYNC_BRANCH }}" --title "$TITLE" --body "$BODY" | grep -oE '[0-9]+$' || true)
            echo "Opened PR #${PR_NUMBER:-unknown}"
          fi

          if [ -n "$PR_NUMBER" ]; then
            echo "Merging PR #${PR_NUMBER} (ruleset allows 0-approval merges)."
            if gh pr merge "$PR_NUMBER" --merge --delete-branch=false; then
              echo "Sync PR #${PR_NUMBER} merged."
              echo "merged_via_pr=true" >> "$GITHUB_ENV"
            else
              echo "::warning::Auto-merge of sync PR #${PR_NUMBER} failed (ruleset may require a human approval)."
              echo "::warning::PR #${PR_NUMBER} is open and ready for review."
            fi
          fi
          echo "::endgroup::"

      # A merge landed via PR (GITHUB_TOKEN) does NOT re-trigger 'on: push'
      # workflows (build.yml), so explicitly dispatch the build. When the
      # GH_BOT_TOKEN path is used, the push is a normal PAT push and does
      # trigger build.yml by itself.
      - name: Dispatch build after successful PR merge
        if: env.changed == 'true' && env.merged_via_pr == 'true'
        run: |
          gh workflow run build.yml --ref "${{ matrix.branch }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}